name: aswine
root_dir: ${oc.env:DATA_DIR,data}/aswine
meta_variant: 1s_pruned # raw | 1s | 1s_pruned
sample_rate: 16000
segment_duration: 1.0
n_mels: 64
hop_length: 160 # 10ms @ 16kHz
win_length: 400 # 25ms @ 16kHz
num_classes: 7
batch_size: 64
num_workers: 4
pin_memory: true
normalize: true

# Quality-gate thresholds calibrated on 500 aswine samples (calibrate_quality_gate.py)
# SNR: mean=5.5 dB, std=3.5 — threshold at p25
# Flatness: mean=0.0012, std=0.0009 — threshold at p75
quality_gate:
  snr_threshold: 3.1
  spectral_flatness_threshold: 0.0015
