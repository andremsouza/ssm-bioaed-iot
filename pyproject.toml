[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioaed"
version = "0.1.0"
description = "Efficiency-first benchmark of state space models and transformers for bioacoustic audio event detection on resource-constrained IoT devices"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "André Moreira Souza", email = "andre.moreira.souza@usp.br" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "lightning>=2.4.0",
    "hydra-core>=1.3.0",
    "hydra-zen>=0.13.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.6.0",
    "optuna>=3.6.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "soundfile>=0.12.0",
    "autorank>=1.3.0",
    "scikit-posthocs>=0.9.0",
    "ptflops>=0.7.0",
    "mamba-ssm>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/andremsouza/ssm-bioaed-iot"
Repository = "https://github.com/andremsouza/ssm-bioaed-iot"
Issues = "https://github.com/andremsouza/ssm-bioaed-iot/issues"

[project.optional-dependencies]
cuda = [
    "timm>=1.0.0",
]
cuda-mamba = [
    "mamba-ssm>=2.2.0",
    "causal-conv1d>=1.4.0",
    "timm>=1.0.0",
    "ninja",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bioaed"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = [
    "ANN401", # dynamically typed expressions (typing.Any)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
# Model code follows state-space / PyTorch math conventions: single-letter matrix
# names (A, B, C, D) and `import torch.nn.functional as F`.
"src/bioaed/models/**/*.py" = ["N803", "N806", "N812"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["mamba_ssm.*", "causal_conv1d.*", "timm.*", "librosa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
