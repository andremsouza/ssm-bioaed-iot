name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Install mamba-ssm / causal-conv1d without compiling CUDA kernels on the
      # CPU runner (matches the repo's `make install-all` flags).
      MAMBA_SKIP_CUDA_BUILD: "TRUE"
      CAUSAL_CONV1D_SKIP_CUDA_BUILD: "TRUE"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      # Advisory: the research code carries some pre-existing type debt, so mypy
      # reports issues without blocking the build. Lint and tests are hard gates.
      - name: Type check (mypy)
        run: uv run mypy src/
        continue-on-error: true

      - name: Tests (pytest)
        run: uv run pytest
